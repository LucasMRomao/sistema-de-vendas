<html>
    <head>
        <title></title>
        <link rel="stylesheet" href="../css/bootstrap.min.css" />
        <link rel="stylesheet" href="../css/cadastro-de-usuarios.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body>
        <div class="row">
            <div class="col-12" style="margin-bottom: 20px;">
                <div class="btn-group" role="group" aria-label="Basic example">
                    <button type="button" class="btn btn-success" data-bs-toggle='modal' data-bs-target='#modalEditarCliente' id="bCadastrarCliente">Cadastrar novo cliente</button>&nbsp;
                    <button type="button" class="btn btn-success" id="bExportarDadosClientes">Exportar dados</button>
                </div>
                <div style="width: 50px; height: 50px; float:right;">
                    <img class="img-fluid" src="../icons/cancel.png" id="bFechar"/>
                </div>
            </div>
            <div class="col-12">
                <div class="alert alert-primary" role="alert">
                    <div class="row">
                        <div class="col">
                            <span><b>Selecionar campos visíveis</b></span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="cVisivelNome" toogle-visibility="nome">
                                <label class="form-check-label" for="cVisivelNome">Nome</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="cVisivelEndereco" toogle-visibility="endereco">
                                <label class="form-check-label" for="cVisivelEndereco">Endereço</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="cVisivelTelefone" toogle-visibility="telefone">
                                <label class="form-check-label" for="cVisivelTelefone">Telefone</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="cVisivelEmail" toogle-visibility="email">
                                <label class="form-check-label" for="cVisivelEmail">Email</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="cVisivelLimite" toogle-visibility="limite">
                                <label class="form-check-label" for="cVisivelLimite">Limite</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="cVisivelAcoes" toogle-visibility="acoes">
                                <label class="form-check-label" for="cVisivelAcoes">Ações</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="alert alert-primary">
                    <div class="row">
                        <div class="col-12">
                            <span><b>Buscar cliente</b></span>
                        </div>
                        <div class="col-12">
                            <div class="input-group mb-3">
                                <select class="form-control" id="sBuscarPor" onchange="changeBuscar()">
                                    <option value="Nome">Nome</option>
                                </select>
                                <input type="text" class="form-control" id="iBuscarNome" placeholder="Digite o nome aqui" aria-label="Username" aria-describedby="basic-addon1">
                              </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <table class="table  table-primary table-hover" id="tableClientes">
                    <thead>
                        <tr>
                            <th style="display: none;">ID</th>
                            <th class="toogle-visibility-nome">Nome</th>
                            <th class="toogle-visibility-endereco">Endereço</th>
                            <th class="toogle-visibility-telefone">Telefone</th>
                            <th class="toogle-visibility-email">Email</th>
                            <th class="toogle-visibility-limite">Limite</th>
                            <th class="toogle-visibility-acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

        <!--Modals-->
        <div class="modal fade" id="modalEditarCliente" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalEditarClienteTitulo">Editar cliente</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div>
                            <input type="hidden" id="idClienteEditar"/>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <div class="input-group-text">Nome</div>
                                <input type="text" class="form-control" id="iNomeEditar">
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <div class="input-group-text">Telefone</div>
                                <input type="text" class="form-control" id="iTelefoneEditar">
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <div class="input-group-text">Endereço</div>
                                <input type="text" class="form-control" id="iEnderecoEditar">
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <div class="input-group-text">Limite</div>
                                <input type="text" class="form-control" id="iLimiteEditar">
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <div class="input-group-text">Ativo</div>
                                <input type="checkbox" class="form-control" id="cAtivoEditar">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="limparEdicao();">Cancelar</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="salvarEdicao();">Salvar</button>
                    </div>
                </div>
            </div>
        </div>
        <!--Fim Modals-->

        <script src="../js/jquery-3.6.4.min.js"></script>
        <script src="../js/bootstrap.min.js"></script>
        <script src="../js/cadastro-de-clientes.js"></script>
    </body>
</html>
