
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <link rel="stylesheet" href="../css/bootstrap.min.css" />
        <link rel="stylesheet" href="../css/configuracoes.css" />
    </head>
    <body>
        <div class="wrapper fadeInDown">
            <div id="formContent">
              <!-- Tabs Titles -->
          
              <!-- Icon -->
              <div class="row d-flex justify-content-center">
                <div class="fadeIn first" style="width: 200px; height: 200px;">
                  <img class="img-fluid" src="../icons/trabalho-em-equipe.png" id="icon" alt="User Icon" />
                </div>
              </div>
          
              <input type="button" id="bAlterarSenha" class="fadeIn fourth" value="Alterar senha">
          
              <!-- Remind Passowrd -->
              <div id="formFooter">
                <!--<a class="underlineHover" href="#">Forgot Password?</a><br/>-->
                <a class="underlineHover" href="#" id="bVoltar">Voltar</a>
              </div>
          
            </div>
        </div>

        <div class="modal" id="modalNovaSenha" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Alterar senha</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="password" id="iNovaSenha" class="fadeIn" name="novaSenha" placeholder="Nova senha">
                    <input type="password" id="iConfirmarSenha" class="fadeIn" name="novaSenha" placeholder="Confirmar senha">
                    <input type="button" id="bConfirmaAlterarSenha" class="fadeIn" value="Alterar">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
                </div>
            </div>
        </div>
        <script type="text/javascript" src="../js/jquery-3.6.4.min.js"></script>
        <script type="text/javascript" src="../js/bootstrap.min.js"></script>
        <script type="text/javascript" src="../js/configuracoes.js"></script>
    </body>
</html>
